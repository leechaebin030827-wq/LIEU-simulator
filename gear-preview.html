<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIEU Yaw 기어 미리보기</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111014; color: #e8e8ee; font: 13px/1.5 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; top: 16px; left: 16px; width: 300px; padding: 14px 16px; background: rgba(24, 24, 30, .86); border: 1px solid #34343e; border-radius: 10px; backdrop-filter: blur(8px); }
      #ui h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
      #ui .mock { display: inline-block; margin: 2px 0 10px; padding: 1px 8px; border-radius: 999px; background: #5a3b12; color: #ffc46b; font-size: 11px; }
      #ui label { display: block; margin: 8px 0 2px; color: #a8a8b4; }
      #ui input[type=range] { width: 100%; }
      #ui .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      #ui .out { margin-top: 12px; padding-top: 10px; border-top: 1px solid #34343e; font: 12px/1.7 ui-monospace, Menlo, monospace; }
      #ui .note { margin-top: 10px; color: #8a8a96; font-size: 11px; }
      #err { position: fixed; bottom: 16px; left: 16px; color: #ff8a8a; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <h1>LIEU Yaw 기어 미리보기</h1>
      <span class="mock">MOCK · 기어비는 형상에서 센 값, 실물 미확인</span>
      <div class="row"><input id="play" type="checkbox" checked /><label for="play" style="margin:0">자동 회전</label></div>
      <label>피니언 각도 <span id="vp"></span></label>
      <input id="ang" type="range" min="-720" max="720" step="0.5" value="0" />
      <label>속도 <span id="vs"></span></label>
      <input id="spd" type="range" min="5" max="360" step="5" value="60" />
      <label>피니언 위상 보정 <span id="vph"></span></label>
      <input id="ph" type="range" min="-180" max="180" step="0.5" value="0" />
      <div class="row"><input id="shell" type="checkbox" /><label for="shell" style="margin:0">외장 보이기</label></div>
      <div class="row"><input id="lower" type="checkbox" checked /><label for="lower" style="margin:0">링에 붙은 부품도 같이 회전 (확인됨)</label></div>
      <div class="out" id="out"></div>
      <div class="note">링 각도 = -피니언 각도 × Np / Nr. 모터에는 아무 명령도 보내지 않습니다.</div>
    </div>
    <div id="err"></div>
    <script type="module" src="/src/gearPreview.ts"></script>
  </body>
</html>
