<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HUD step 1: approaching, the route turns right into the alley ahead -->
  <defs>
    <linearGradient id="fadeV" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="700"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="fadeH" gradientUnits="userSpaceOnUse" x1="660" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="road"><rect width="1024" height="1024" fill="url(#fadeV)"/></mask>
    <mask id="alley"><rect width="1024" height="1024" fill="url(#fadeH)"/></mask>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>

  <!-- road in perspective, with the alley opening on the right -->
  <g stroke="#eef4f8" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
    <g mask="url(#road)">
      <path d="M232 1000L480 380"/>
      <path d="M792 1000L648 640M616 560L544 380"/>
      <path d="M512 1000V380" stroke-opacity="0.25" stroke-dasharray="44 40"/>
    </g>
    <g mask="url(#alley)"><path d="M616 560H1000M648 640H1000"/></g>
  </g>

  <!-- planned route: straight, then right into the alley -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 1000V640Q512 600 552 600H940" stroke="#eef4f8" stroke-opacity="0.16" stroke-width="44" mask="url(#alley)"/>
    <path d="M512 1000V640Q512 600 552 600H940" stroke="#eef4f8" stroke-width="4" mask="url(#alley)"/>
    <g stroke="#eef4f8" stroke-width="6">
      <path d="M488 902L512 878L536 902"/>
      <path d="M492 792L512 772L532 792" stroke-opacity="0.8"/>
      <path d="M496 696L512 680L528 696" stroke-opacity="0.6"/>
      <path d="M688 584L704 600L688 616"/>
      <path d="M796 584L812 600L796 616" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- ego marker -->
  <path d="M488 984L512 960L536 984" fill="none" stroke="#eef4f8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- info -->
  <g transform="translate(366 166)" fill="none" stroke="#eef4f8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-16 32V-2Q-16 -18 0 -18H22"/><path d="M10 -32L24 -18L10 -4"/>
  </g>
  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, Arial, sans-serif" fill="#eef4f8">
    <text x="458" y="166" font-size="52" font-weight="300">30<tspan font-size="28" dx="6" fill-opacity="0.7">m</tspan></text>
    <text x="460" y="204" font-size="24" font-weight="500" letter-spacing="2" fill-opacity="0.7">우측 골목 진입</text>
  </g>
</svg>
